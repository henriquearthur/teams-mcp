name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".mcp.json"
      - ".vscode/**"
      - ".github/dependabot.yml"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish-npm:
    if: github.repository == 'henriquearthur/teams-mcp'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run ci
      - run: npm test

      # Next minor above both the latest published version and package.json (which may move with upstream merges).
      - name: Compute next version
        id: version
        run: |
          published=$(curl -sf "https://registry.npmjs.org/-/package/@henriquearthur%2fteams-mcp/dist-tags" \
            | node -p 'JSON.parse(require("fs").readFileSync(0)).latest' || echo 0.0.0)
          next=$(node -e '
            const parse = (v) => v.split(".").map(Number);
            const [a, b] = [parse(process.argv[1]), parse(require("./package.json").version)];
            const [major, minor] = (a[0] - b[0] || a[1] - b[1] || a[2] - b[2]) >= 0 ? a : b;
            console.log(`${major}.${minor + 1}.0`);
          ' "$published")
          echo "Published: $published, next: $next"
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Set version
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          npm version "$NEXT" --no-git-tag-version
          sed -i -E "s/version: \"[0-9]+\.[0-9]+\.[0-9]+\"/version: \"$NEXT\"/" src/server.ts
          grep -q "version: \"$NEXT\"" src/server.ts

      - run: npm publish

      - name: Tag release
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          git tag "v$NEXT" "$GITHUB_SHA"
          git push origin "v$NEXT"
